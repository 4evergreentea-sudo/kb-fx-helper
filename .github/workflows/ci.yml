name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    name: Lint · Architecture · Typecheck · Test · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks (lint, arch:check, typecheck, test, build)
        run: npm run check
